_version = 1

[workflow]
graph = "workflow.fabro"

[run]
goal = "Address new comments and reviews on the existing PR for {{ inputs.repository }}#{{ inputs.issue }}"

[run.inputs]
repository = ""
issue = 0
job = ""

[run.pull_request]
enabled = false
auto_merge = false

[run.run_branch]
push = false

[run.artifacts]
include = [".fabro-context.md", ".fabro-review-*.md"]

