name: Build image and chart
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish image and Helm chart to private GHCR packages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Read skills pin
        run: |
          SKILLS_REF="$(cat container/skills-ref)"
          [[ "$SKILLS_REF" =~ ^[0-9a-f]{40}$ ]]
          echo "SKILLS_REF=$SKILLS_REF" >> "$GITHUB_ENV"
      - name: Checkout versioned skills and agents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: geoberle/skillshare-config
          ref: ${{ env.SKILLS_REF }}
          token: ${{ secrets.SKILLS_READ_TOKEN || github.token }}
          path: .local/skillshare
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13.1'
      - name: Prepare isolated build context
        run: python3 scripts/image-context.py --skills-source .local/skillshare
      - name: Build
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:sha-${REVISION}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "io.factory.skills.revision=$SKILLS_REF" \
            -t "$IMAGE" .local/build
          docker run --rm --entrypoint orchestrator "$IMAGE" --help
          docker run --rm --entrypoint sh "$IMAGE" -ec \
            'test -s /opt/experiment/bundle/skills/implement/SKILL.md; test -x /experiment/scripts/issue-agent.sh'
      - name: Smoke-test agent startup and shared caches
        run: |
          docker run --rm --entrypoint python3 -v "$PWD/tests:/tests:ro" \
            "$IMAGE" /tests/agent_startup.py
      - name: Install Helm
        run: |
          curl -fsSLo "$RUNNER_TEMP/helm-v3.16.4-linux-arm64.tar.gz" https://get.helm.sh/helm-v3.16.4-linux-arm64.tar.gz
          curl -fsSLo "$RUNNER_TEMP/helm.sha256" https://get.helm.sh/helm-v3.16.4-linux-arm64.tar.gz.sha256sum
          cd "$RUNNER_TEMP"
          sha256sum --check helm.sha256
          tar -xzf helm-v3.16.4-linux-arm64.tar.gz
          mkdir -p "$HOME/.local/bin"
          install linux-arm64/helm "$HOME/.local/bin/helm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate and package chart
        env:
          REVISION: ${{ github.sha }}
        run: |
          BASE_VERSION="$(awk '/^version:/ { print $2 }' charts/factory/Chart.yaml)"
          CHART_VERSION="${BASE_VERSION}-sha.${REVISION}"
          echo "CHART_VERSION=$CHART_VERSION" >> "$GITHUB_ENV"
          helm lint charts/factory -f charts/factory/example-values.yaml --set "image.tag=sha-${REVISION}"
          helm template factory charts/factory -f charts/factory/example-values.yaml --set "image.tag=sha-${REVISION}" > /dev/null
          helm package charts/factory --version "$CHART_VERSION" --app-version "sha-${REVISION}" --destination .local/chart
      - name: Publish
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          trap 'docker logout ghcr.io; helm registry logout ghcr.io' EXIT
          docker push "$IMAGE"
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          REGISTRY_NAMESPACE="${IMAGE%/*}"
          helm push ".local/chart/forgekeeper-chart-${CHART_VERSION}.tgz" "oci://${REGISTRY_NAMESPACE}"
          printf 'Image: `%s`\n\nChart: `oci://%s/forgekeeper-chart` version `%s`\n' \
            "$IMAGE" "$REGISTRY_NAMESPACE" "$CHART_VERSION" >> "$GITHUB_STEP_SUMMARY"
