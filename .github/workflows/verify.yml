name: Verify
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13.1'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.25.5'
          cache: true
      - name: Install Helm
        run: |
          curl -fsSLo "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz
          curl -fsSLo "$RUNNER_TEMP/helm.sha256" https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz.sha256sum
          cd "$RUNNER_TEMP"
          mv helm.tar.gz helm-v3.16.4-linux-amd64.tar.gz
          sha256sum --check helm.sha256
          tar -xzf helm-v3.16.4-linux-amd64.tar.gz
          mkdir -p "$HOME/.local/bin"
          install linux-amd64/helm "$HOME/.local/bin/helm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make verify
      - run: make build
