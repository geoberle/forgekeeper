image:
  repository: ghcr.io/geoberle/forgekeeper
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Existing Secret: github-pat, FABRO_DEV_TOKEN, SESSION_SECRET.
secretName: factory-auth
webURL: http://localhost:32277
nodeSelector:
  kubernetes.io/arch: arm64
ingress:
  enabled: false
  className: ""
  annotations: {}
  tlsSecretName: factory-tls
orchestrator:
  retryUser: ""  # Required GitHub login for retry authorization.
  preview: true
  interval: 1m
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
fabro:
  codex:
    implement:
      model: gpt-6.1-sol
      model_reasoning_effort: medium
    review:
      model: gpt-6-astra
      model_reasoning_effort: low
    pr:
      model: gpt-6.1-sol
      model_reasoning_effort: low
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 8Gi
storage:
  server:
    size: 20Gi
    storageClass: ""
    existingClaim: ""
  jobs:
    accessMode: ReadWriteMany
    size: 20Gi
    storageClass: ""
    existingClaim: ""
# One YAML document per key. Supply your projects explicitly at installation.
projects: {}
