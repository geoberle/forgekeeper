{{- range $component := list "fabro" "orchestrator" }}
---
apiVersion: apps/v1
kind: {{ if eq $component "fabro" }}StatefulSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ include "factory.name" $ }}-{{ $component }}
spec:
  replicas: 1
  {{- if eq $component "fabro" }}
  serviceName: {{ include "factory.name" $ }}-fabro
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") $ | sha256sum }}
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "factory.security" $ | nindent 8 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: prepare
          image: {{ include "factory.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- include "factory.containerSecurity" $ | nindent 12 }}
          command: [sh, /experiment/scripts/k8s-prepare.sh]
          args:
            - {{ if eq $component "fabro" }}http://127.0.0.1:32276{{ else }}http://{{ include "factory.name" $ }}-fabro:32276{{ end }}
          env:
            - name: FABRO_DEV_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: FABRO_DEV_TOKEN
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: jobs
              mountPath: /storage/issue-jobs
            - name: credentials
              mountPath: /run/secrets
              readOnly: true
      containers:
        - name: {{ $component }}
          image: {{ include "factory.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- include "factory.containerSecurity" $ | nindent 12 }}
          {{- if eq $component "fabro" }}
          command: [fabro]
          args: [server, start, --foreground, --config, /experiment/settings/settings.toml]
          ports:
            - name: http
              containerPort: 32276
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
          {{- else }}
          command: [orchestrator]
          args:
            - --fabro-url=http://{{ include "factory.name" $ }}-fabro:32276
            - --allow-http-fabro
            - {{ printf "--web-url=%s" $.Values.webURL | quote }}
            - {{ printf "--interval=%s" $.Values.orchestrator.interval | quote }}
            {{- if $.Values.orchestrator.preview }}
            - --preview
            {{- end }}
          {{- end }}
          env:
            - name: FABRO_DEV_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: FABRO_DEV_TOKEN
            {{- if eq $component "fabro" }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: SESSION_SECRET
            {{- end }}
          resources:
            {{- toYaml (index $.Values $component).resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: jobs
              mountPath: /storage/issue-jobs
            {{- if eq $component "fabro" }}
            - name: settings
              mountPath: /experiment/settings
              readOnly: true
            {{- else }}
            - name: projects
              mountPath: /experiment/projects
              readOnly: true
            {{- end }}
      volumes:
        - name: storage
          {{- if eq $component "fabro" }}
          persistentVolumeClaim:
            claimName: {{ $.Values.storage.server.existingClaim | default (printf "%s-server" (include "factory.name" $)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: jobs
          persistentVolumeClaim:
            claimName: {{ $.Values.storage.jobs.existingClaim | default (printf "%s-jobs" (include "factory.name" $)) }}
        - name: credentials
          secret:
            secretName: {{ $.Values.secretName }}
            defaultMode: 0440
            items:
              - key: github-pat
                path: github-pat
        {{- if eq $component "fabro" }}
        - name: settings
          configMap:
            name: {{ include "factory.name" $ }}-settings
        {{- else }}
        - name: projects
          configMap:
            name: {{ include "factory.name" $ }}-projects
        {{- end }}
{{- end }}
